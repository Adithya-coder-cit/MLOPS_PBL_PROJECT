[project]
name = "routewise"
version = "0.1.0"
description = "AI-Powered Smart Travel Recommendation System (RouteWise) — MLOps course project"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
