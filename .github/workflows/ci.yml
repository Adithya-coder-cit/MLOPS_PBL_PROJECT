name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ api/ training/ inference/ tests/

      - name: Unit tests
        run: pytest tests/ -v

      # Data validation, model validation, and build verification steps are
      # added once the corresponding pipeline stages exist (ingestion,
      # training). Not yet implemented — do not remove this comment when
      # extending the workflow, it documents why those steps are absent.
