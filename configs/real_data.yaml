# Stage 11B: configuration for the REAL (MBTA) data source adapters.
# Mirrors configs/synthetic_data.yaml's role for the DEMO source -- this
# file is the documented, versioned methodology for the REAL path, never
# mixed into the synthetic generator's own config.

dataset_type: REAL
provider: MBTA / MassDOT
license_reference: >
  MassDOT Developers License Agreement -- see
  docs/stage11a-source-license-verification.md for the full clause-by-clause
  reading. Attribution to MassDOT/MBTA is REQUIRED by this license.

sources:
  gtfs_static:
    url: https://cdn.mbta.com/MBTA_GTFS.zip
    provider: MBTA
  historical_subway:
    # One Parquet file per service_date; index lists every available date.
    index_url: https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/index.csv
    provider: MBTA LAMP
  historical_bus:
    # "RECENT" is a bounded rolling window (verified: last 7 days as of
    # Stage 11B) -- the full LAMP_ALL_Bus_Events.parquet (multi-GB) is the
    # deep-history equivalent, not ingested in this stage; see the Stage
    # 11B report's documented limitation.
    url: https://performancedata.mbta.com/lamp/tableau/bus/LAMP_RECENT_Bus_Events.parquet
    provider: MBTA LAMP
  weather:
    # NWS station observations -- free, no API key (a descriptive
    # User-Agent header is required instead), covers only a short rolling
    # window (Stage 11B/C finding).
    provider: NWS (api.weather.gov)
    station: KBOS # Boston Logan International Airport
    base_url: https://api.weather.gov
  weather_ghcnh:
    # Stage 11D: NOAA GHCNh (Global Historical Climatology Network hourly)
    # -- https://www.ncei.noaa.gov/products/global-historical-climatology-network-hourly
    # Official deep-historical hourly archive, no API key. weather_zone_id
    # below MUST match sources.weather.station above -- both adapters
    # describe the same physical station (Boston Logan) and must resolve
    # to the same join key.
    provider: NOAA NCEI (GHCNh v1)
    station_id: USW00014739 # Boston Logan International Airport (same station as KBOS)
    weather_zone_id: KBOS
    base_url: https://www.ncei.noaa.gov/oa/global-historical-climatology-network/hourly/access/by-year
    # Years to bulk-download. The 2026 file covers the real MBTA training
    # window (2026-08-01 .. 2026-09-29); 2025 is included for a modest
    # additional historical baseline. See
    # data/interim/real/weather_coverage_report.json for measured coverage.
    years: [2025, 2026]

# GTFS route_type -> RouteWise transport_mode. Standard GTFS basic route
# types (0-4) map directly except Green Line light rail, which is an
# explicit PROJECT-LEVEL SEMANTIC MAPPING, not an official MBTA/GTFS
# equivalence -- see docs/stage11a-source-license-verification.md Section 4.
# Any GTFS route_type value NOT listed here is UNKNOWN and must raise a
# validation warning/error, never be silently mapped.
mode_mapping:
  by_route_type:
    "0": tram    # PROJECT SEMANTIC MAPPING: GTFS "Tram, Streetcar, Light rail" -- covers
                 # MBTA Green Line (Green-B/C/D/E) and the Mattapan Trolley in this feed.
                 # MBTA does not itself call this service "tram"; RouteWise does, for
                 # consistency with its existing 5-mode vocabulary from the synthetic stage.
    "1": metro   # Direct match: MBTA "Subway" (Red/Orange/Blue Lines)
    "2": rail    # Direct match: MBTA "Commuter Rail"
    "3": bus     # Direct match: MBTA "Bus"
    "4": ferry   # Direct match: MBTA "Ferry"
  unknown_mode_severity: ERROR # a route_type not in by_route_type above fails validation loudly

# Stage 11B Sec 11: label availability policy, per mode -- decided from
# the Stage 11A verification (official LAMP Data Dictionary field check),
# not assumed. NEVER assign disruption_flag=0 where label_available=false.
label_availability:
  bus: true
  metro: true
  tram: true
  rail: false   # no confirmed real scheduled-vs-actual source found (Stage 11A Sec 5)
  ferry: false  # same

# Stage 11E: FROZEN and ACTIVATED. Stage 11C's label_policy_recommendation
# (data/interim/real/label_policy_recommendation.json) proposed these exact
# values from the real per-mode delay distribution (smallest threshold per
# mode landing in an operationally reasonable 2%-40% positive-rate band);
# Stage 11E's instructions explicitly freeze them as the human-approved
# policy for finalizing the real supervised-learning dataset. Do not change
# these values without a new, documented decision -- src/ingestion/
# label_policy.py::verify_frozen_label_policy re-verifies them against the
# real ingested data every pipeline run rather than trusting this file blindly.
real_disruption_label_policy:
  active: true
  decision_required: >
    RESOLVED (Stage 11E): thresholds frozen from the Stage 11C
    label_policy_recommendation.json analysis of the real per-mode delay
    distribution -- never ported from configs/synthetic_data.yaml's
    mode_params.*.disruption_threshold_minutes values, which were tuned for
    the synthetic generator's label balance, not derived from real data.
  placeholder_thresholds_seconds:
    bus: 300
    metro: 180
    tram: 180
  cancellation_counts_as_disruption: true

# Stage 11B Sec 14: weather join parameters (leakage-safe asof-join,
# mirrors src/preprocessing/clean.py::join_weather_asof's existing
# backward-only, bounded-tolerance discipline).
weather_join:
  method: nearest_station_asof
  max_time_difference_hours: 2
  direction: backward # never a future observation, same guarantee as the synthetic path
  max_distance_km: 50 # a single Boston-area station covers the whole MBTA network at this tolerance
