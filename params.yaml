# DVC pipeline parameters. Referenced by dvc.yaml stages (added in a later stage)
# and by training/ scripts. Values here are starting defaults for the
# development/demo dataset — not tuned, not evaluated.

data:
  mode: demo # "demo" | "production"
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  random_seed: 42
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

features:
  weather:
    - precipitation_mm
    - visibility_km
    - temperature_c
  historical:
    - historical_delay_minutes
    - rolling_7d_delay_minutes
  temporal:
    - time_of_day_bucket
    - day_period # peak | off_peak | night
  network:
    - transfer_dependency
    - route_id
    - transport_mode

model:
  primary:
    type: xgboost
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      objective: binary:logistic
      eval_metric: logloss
      random_state: 42
    # Modest, curated search (not a full cartesian grid) — Stage 4 picks the
    # best of these plus the default above by validation-set PR-AUC.
    search_grid:
      - {n_estimators: 200, max_depth: 4, learning_rate: 0.10, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 1}
      - {n_estimators: 300, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 5}
      - {n_estimators: 400, max_depth: 6, learning_rate: 0.05, subsample: 1.0, colsample_bytree: 1.0, min_child_weight: 1}
      - {n_estimators: 300, max_depth: 8, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.6, min_child_weight: 10}
      - {n_estimators: 500, max_depth: 4, learning_rate: 0.03, subsample: 1.0, colsample_bytree: 0.8, min_child_weight: 5}
  baseline:
    type: random_forest
    params:
      n_estimators: 200
      max_depth: 10
      random_state: 42
    search_grid:
      - {n_estimators: 200, max_depth: 10, min_samples_split: 2, min_samples_leaf: 1, max_features: "sqrt"}
      - {n_estimators: 300, max_depth: 15, min_samples_split: 5, min_samples_leaf: 2, max_features: "sqrt"}
      - {n_estimators: 300, max_depth: 20, min_samples_split: 10, min_samples_leaf: 4, max_features: "log2"}
      - {n_estimators: 400, max_depth: null, min_samples_split: 10, min_samples_leaf: 2, max_features: "sqrt"}
      - {n_estimators: 200, max_depth: 12, min_samples_split: 5, min_samples_leaf: 5, max_features: 0.5}

decision_engine:
  # Score = alpha*C + beta*T - gamma*R, where C/T/R are NORMALIZED to
  # [0,1] (see routing.normalization below) before this formula is
  # applied. Lower score is better. These weights are an engineering
  # policy choice, not a scientifically derived optimum.
  baseline_weights:
    alpha: 0.34
    beta: 0.33
    gamma: 0.33
  # When a route's aggregate disruption risk exceeds this threshold, the
  # weights below are used instead of baseline_weights — a deterministic,
  # documented policy switch (not a smooth/learned function). This is a
  # configurable decision policy, not a scientifically proven formula.
  high_risk_threshold: 0.40
  high_risk_weights:
    alpha: 0.27
    beta: 0.23
    gamma: 0.50
  # Kept for backwards reference / documentation: high_risk gamma above
  # equals baseline gamma boosted by roughly this factor.
  adaptive_reliability_boost: 0.5

# Thresholds for the UI's Low/Moderate/High risk LABEL only — a display/
# communication concern, deliberately separate from
# decision_engine.high_risk_threshold above (which switches the SCORING
# policy). These are engineering choices for readability, not a
# scientifically or safety-certified classification of risk. Exposed via
# GET /system/status so the frontend never hardcodes its own copy.
ui_risk_labels:
  moderate_threshold: 0.20 # disruption_risk >= this -> "Moderate"
  high_threshold: 0.40 # disruption_risk >= this -> "High" (below moderate_threshold -> "Low")

routing:
  normalization:
    # "minmax_candidates": normalize each candidate's C/T/R against the
    #   min/max observed across the OTHER candidates in the same query
    #   (adaptive, no hardcoded scale, but needs >=2 candidates).
    # "fixed_bounds": normalize against the fixed bounds below — used
    #   automatically when there's only one candidate to compare.
    method: minmax_candidates
    fixed_bounds:
      cost: {min: 0, max: 100} # SYNTHETIC_UNITS, matches fares.csv scale
      time_minutes: {min: 0, max: 180}
      reliability: {min: 0.0, max: 1.0}
  transfer_penalty:
    # Applied ONCE per transfer point when aggregating a path (not per
    # edge, not baked into search weights) — an engineering estimate, not
    # measured from data.
    time_minutes: 5.0
    cost: 2.0
    reliability_penalty: 0.02 # subtracted from the path's aggregate reliability per transfer
  candidate_generation:
    k_shortest_paths: 5
    strategies: [shortest_time, lowest_cost, lowest_risk, k_shortest_time]
  prediction_context:
    # Used to build the feature vector for each edge's disruption
    # prediction when the caller doesn't supply a specific query time /
    # weather. NOT real-time data — a documented, fixed reference point
    # within the training data's date range, chosen for reproducibility.
    default_datetime: "2025-09-15T08:00:00" # a weekday within the dataset's range, morning peak
    default_weather:
      precipitation_mm: 0.0
      temperature_c: 24.0
      visibility_km: 10.0

mlflow:
  experiment_name: RouteWise-Disruption-Prediction
  registered_model_name: RouteWise-Disruption-Model
  tracking_uri: ./mlruns

evaluation:
  promotion_gates:
    # These are ENGINEERING ACCEPTANCE CRITERIA chosen as reasonable round
    # numbers for this project's early stage — NOT scientifically derived
    # thresholds, and not tuned to make any particular model pass. They are
    # deliberately independent of what Stage 4 happened to measure.
    # Evaluated on the TEST set (the same one-time evaluation from Stage 4,
    # never re-evaluated to chase a pass).
    minimum_thresholds:
      min_pr_auc: 0.35
      min_recall: 0.50
      min_precision: 0.35
      min_f1: 0.60
      min_roc_auc: 0.65
    # A candidate must not regress vs. the CURRENT production model by more
    # than this absolute amount, per metric. Also an engineering choice, not
    # a statistically derived tolerance.
    regression_tolerance:
      pr_auc: 0.03
      recall: 0.03
      precision: 0.03
      f1: 0.03
      roc_auc: 0.03
    # A candidate must clear minimum_thresholds AND (if a production model
    # already exists) regression_tolerance before it can move
    # Candidate -> Validated. Validated -> Production is never automatic —
    # see training/promote_model.py.

training:
  seed: 42
  # PR-AUC (not accuracy/ROC-AUC alone) drives model selection, since
  # disruption is the minority class and PR-AUC is more sensitive to
  # minority-class performance under imbalance.
  selection_metric: pr_auc
  decision_threshold: 0.5
  class_imbalance:
    # Computed from the TRAIN split only. If train's negative:positive
    # ratio exceeds this, apply class weighting (XGBoost scale_pos_weight /
    # RandomForest class_weight="balanced") rather than oversampling.
    ratio_threshold_for_weighting: 1.5

monitoring:
  # Stage 9 — observational ML/data/operational monitoring (Evidently AI,
  # version pinned in requirements.txt). This project has no production
  # model yet and uses DEVELOPMENT/DEMO synthetic data throughout — every
  # result a monitoring run produces is stamped dataset_type=
  # "DEVELOPMENT/DEMO" (see src/monitoring/schemas.py) and must never be
  # read as a claim about live Chennai transport conditions.
  reference:
    # The chronologically EARLIEST processed split — the distribution the
    # currently configured model was actually trained on. Its lineage
    # (dataset version, DVC hash, feature-manifest version, model
    # name/version, git SHA) is captured once into
    # data/interim/monitoring/reference_metadata.json and never silently
    # overwritten (see src/monitoring/reference.py).
    split: train
  current:
    # The chronologically LATEST processed split. This project has no
    # live production traffic yet, so a controlled batch from the
    # existing test split stands in for "current" data — always labelled
    # DEVELOPMENT/DEMO MONITORING, never "live" or "production".
    split: test
  # Below this many rows, a monitoring run refuses to proceed rather than
  # report a statistically unreliable drift/quality result.
  minimum_batch_size: 30
  # Empty -> derived from data/processed/feature_manifest.json's
  # model_usage=="feature" columns (never duplicated/re-listed here — see
  # Stage 9 §1 "do not duplicate feature-engineering logic"). Set an
  # explicit list only for a deliberately narrowed/controlled check.
  monitored_features: []
  data_quality:
    # Share of a monitored column's values that may be missing in the
    # current batch before that column is flagged FAIL. A conservative,
    # round engineering number — not fit to this dataset.
    max_missing_share: 0.05
    # A numeric value more than this many REFERENCE standard deviations
    # outside the reference-observed [min, max] is flagged as an
    # "invalid range" observation. Grounded in the reference distribution
    # itself, not an arbitrary hardcoded bound.
    range_tolerance_std: 3.0
  data_drift:
    # Per-feature method: Kolmogorov-Smirnov test for numeric columns
    # (Evidently returns a p-value; drift is flagged when the p-value is
    # BELOW numerical_threshold — the standard 0.05 significance level)
    # and Population Stability Index for categorical columns (drift is
    # flagged when PSI is ABOVE categorical_threshold — 0.1 is the
    # conventional "moderate shift" cutoff; industry practice treats
    # >0.25 as "significant"). Both are stattests Evidently ships
    # natively (see src/monitoring/data_drift.py, which inspects the
    # installed API before using it).
    numerical_stattest: ks
    numerical_threshold: 0.05
    categorical_stattest: psi
    categorical_threshold: 0.1
    # Share of the monitored columns that must be individually drifted
    # before the BATCH as a whole is called "dataset drift" — Evidently's
    # own DatasetDriftMetric default, made explicit here rather than
    # left implicit.
    dataset_drift_share: 0.5
  prediction_drift:
    # Same two methods, applied to the model's OWN outputs instead of its
    # inputs — deliberately configured separately from data_drift above
    # so the two can never be silently conflated (Stage 9 §11).
    probability_stattest: ks
    probability_threshold: 0.05
    class_stattest: psi
    class_threshold: 0.1
  performance:
    # A metric dropping by more than this absolute amount vs. the
    # baseline recorded at training time (the model's own logged
    # test_* metrics) is a REGRESSION. Deliberately a separate config
    # block from evaluation.promotion_gates.regression_tolerance above —
    # that one gates promotion (a one-time decision); this one gates
    # ongoing monitoring (a repeated observation) — even though the
    # starting values happen to match.
    regression_tolerance:
      pr_auc: 0.05
      recall: 0.05
      precision: 0.05
      f1: 0.05
      roc_auc: 0.05
  decision_policy:
    # Deterministic, config-driven monitoring decision consumed by Stage
    # 10 — Stage 9 itself never retrains anything (Stage 9 §10/§15).
    # Feature drift and prediction drift alone can only ever escalate to
    # REVIEW_REQUIRED, never straight to RETRAINING_RECOMMENDED — drift is
    # NOT equated with model failure (Stage 9 §11). Only a measured
    # PERFORMANCE regression can trigger RETRAINING_RECOMMENDED.
    review_required_if_data_quality_fail: true
    review_required_if_data_drift_detected: true
    review_required_if_prediction_drift_detected: true
    retraining_recommended_if_performance_degraded: true

retraining:
  # Stage 10 — automated retraining orchestration (training/retrain.py).
  # Reuses training.train + training.track_and_register + the existing
  # Stage 5 promotion gate unchanged; this section only configures the
  # orchestration itself, never a duplicate copy of promotion criteria
  # (those stay in evaluation.promotion_gates above).
  default_model_selection: both # "xgboost" | "random_forest" | "both"
  # "manual" (default, everywhere): a candidate that clears the gate stops
  # at lifecycle_stage=Validated — a human runs training/promote_model.py
  # --confirm to move it to Production. "auto": retrain.py itself calls
  # promote_model.promote() for the best gate-passing candidate — only
  # ever reachable via an EXPLICIT --promotion-mode auto flag (a
  # deliberate, logged choice by whoever ran or dispatched the job), and
  # only when the real gate actually passed on real test metrics. Never
  # an implicit "best available candidate" promotion (Stage 10 §10).
  default_promotion_mode: manual
  # Dependencies retrain.py's safety check actually imports and verifies
  # against requirements.txt's pins — not the full requirements.txt
  # (unrelated API package drift is irrelevant to training safety).
  dependency_compatibility_check:
    - pandas
    - numpy
    - scikit-learn
    - xgboost
    - mlflow
    - pyyaml
